plugins {
    id 'com.android.application'
}

android {
    namespace 'za.co.pantrywise'
    compileSdk 35

    defaultConfig {
        applicationId 'za.co.pantrywise'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
